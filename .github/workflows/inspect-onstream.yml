name: Inspect OnStream archives
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect ZIPs safely
        shell: bash
        run: |
          python - <<'PY'
          import os, re, zipfile, collections, xml.etree.ElementTree as ET
          from urllib.parse import urlsplit

          out = []
          def add(s=""): out.append(str(s))
          def clean(s): return str(s).replace(chr(96), "'").replace("\n", " ")[:1000]
          add("# Focused OnStream archive inspection report")
          add("")
          add("ZIPs were read in memory only. No Android code was executed.")
          add("")
          endpoints = collections.Counter()
          candidates = []
          library = collections.Counter()
          total_scanned = 0
          jadx = "jadx-sources.zip"

          for arc in [jadx, "apktool-output.zip"]:
              add("## " + arc)
              if not os.path.isfile(arc):
                  add("Archive not found.")
                  continue
              try:
                  z = zipfile.ZipFile(arc)
                  infos = [i for i in z.infolist() if not i.is_dir()]
                  add(f"- Entries: {len(infos)}")
                  add(f"- Expanded size: {sum(i.file_size for i in infos):,} bytes")
                  roots = collections.Counter((i.filename.split("/")[0] if "/" in i.filename else "(root)") for i in infos)
                  add("- Root folders: " + ", ".join(f"{clean(k)} ({v})" for k,v in roots.most_common(12)))
                  if arc == jadx:
                      sources = [i for i in infos if i.filename.startswith("sources/") and i.filename.endswith((".java", ".kt"))]
                      add(f"- Decompiled Java/Kotlin files: {len(sources)}")
                      packages = collections.Counter("/".join(i.filename.split("/")[:3]) for i in sources if len(i.filename.split("/")) >= 3)
                      add("- Most populated source folders: " + ", ".join(f"{clean(k)} ({v})" for k,v in packages.most_common(24)))
                      manifest = next((i for i in infos if i.filename == "resources/AndroidManifest.xml"), None)
                      add("")
                      add("### Android manifest")
                      if manifest:
                          try:
                              root = ET.fromstring(z.read(manifest))
                              A = "{http://schemas.android.com/apk/res/android}"
                              add("- Package: " + clean(root.attrib.get("package", "?")))
                              add("- Version: " + clean(root.attrib.get(A+"versionName", "?")) + "; code " + clean(root.attrib.get(A+"versionCode", "?")))
                              sdk = root.find("uses-sdk")
                              if sdk is not None:
                                  add("- Android SDK min/target: " + clean(sdk.attrib.get(A+"minSdkVersion", "?")) + " / " + clean(sdk.attrib.get(A+"targetSdkVersion", "?")))
                              app = root.find("application")
                              if app is not None:
                                  add("- App label: " + clean(app.attrib.get(A+"label", "?")))
                                  add("- Application class: " + clean(app.attrib.get(A+"name", "(default)")))
                                  for node in list(app):
                                      tag = node.tag.split("}")[-1]
                                      if tag not in ("activity", "activity-alias", "service", "receiver", "provider"): continue
                                      name = node.attrib.get(A+"name", "?")
                                      actions, cats = [], []
                                      for fil in node.findall("intent-filter"):
                                          actions += [x.attrib.get(A+"name","") for x in fil.findall("action")]
                                          cats += [x.attrib.get(A+"name","") for x in fil.findall("category")]
                                      marker = " [LAUNCHER]" if "android.intent.action.MAIN" in actions and "android.intent.category.LAUNCHER" in cats else ""
                                      add(f"- {tag}: {clean(name)} exported={clean(node.attrib.get(A+'exported','unspecified'))}{marker}")
                                      if actions: add("  actions: " + ", ".join(clean(x) for x in actions[:6]))
                              perms = [n.attrib.get(A+"name","") for n in root.findall("uses-permission")]
                              add("- Permissions: " + ", ".join(clean(x) for x in perms[:32]))
                          except Exception as e:
                              add("Could not parse manifest: " + clean(e))
                      else:
                          add("Decoded manifest not found.")
                      # App-facing strings
                      pat = re.compile(r"(app_name|player|movie|show|series|search|source|stream|subtitle|quality|season|episode|error|loading|setting|about|watch|server|retry|download|category|genre|language|external|network|update|login|premium|unlock)", re.I)
                      found = []
                      for si in infos:
                          if not (si.filename.startswith("resources/") and si.filename.endswith("strings.xml")): continue
                          try:
                              rt = ET.fromstring(z.read(si))
                              for n in rt:
                                  nm = n.attrib.get("name","")
                                  val = "".join(n.itertext()).strip()
                                  if nm and val and pat.search(nm):
                                      found.append((nm, val))
                          except Exception: pass
                      add("")
                      add("### Relevant app text (first 80 matches)")
                      add(f"- Matches: {len(found)}")
                      for nm,val in found[:80]: add("- " + clean(nm) + " = " + clean(val)[:150])
                  else:
                      paths = [i.filename for i in infos if re.search(r"(AndroidManifest|activity_main|activity_home|activity_player|item_movie|item_series|strings\.xml|network_security_config|player|movie|episode|season|search|stream|subtitle|video)", i.filename, re.I)]
                      add("- Relevant resource/Smali paths: " + str(len(paths)))
                      for p in paths[:80]: add("  - " + clean(p))
                  add("")
              except Exception as e:
                  add("Archive error: " + clean(e))
                  add("")

          # Scan all JADX source and resource text files, not only the first 2,200.
          if os.path.isfile(jadx):
              with zipfile.ZipFile(jadx) as z:
                  infos = z.infolist()
                  hits = re.compile(r"(StyledPlayerView|ExoPlayer|MediaItem|DefaultHttpDataSource|OkHttpClient|Retrofit|BASE_URL|baseUrl|api[_-]?key|themoviedb|tmdb|m3u8|\.mpd\b|OpenSubtitles|FirebaseRemoteConfig|extends AppCompatActivity|extends Activity|extends Fragment|setContentView|onCreate\s*\(|R\.string\.|R\.layout\.)", re.I)
                  for i in infos:
                      nm = i.filename
                      if i.is_dir() or not nm.startswith("sources/") or not nm.lower().endswith((".java", ".kt", ".xml", ".json", ".properties", ".gradle", ".txt")) or i.file_size > 350000:
                          continue
                      try: txt = z.read(i).decode("utf-8", "ignore")
                      except Exception: continue
                      total_scanned += 1
                      for url in re.findall(r'https?://[^\s"\'<>\\)]+', txt, re.I):
                          try:
                              host = urlsplit(url.rstrip(".,;")).hostname
                              if host: endpoints[host.lower()] += 1
                          except Exception: pass
                      for label,rx in [
                          ("player",r"StyledPlayerView|ExoPlayer|MediaItem"),
                          ("network",r"OkHttpClient|Retrofit|DefaultHttpDataSource"),
                          ("catalog/API",r"themoviedb|tmdb|BASE_URL|baseUrl|api[_-]?key"),
                          ("stream formats",r"m3u8|\.mpd\b|HLS|DASH"),
                          ("Android screens",r"extends AppCompatActivity|extends Activity|extends Fragment|setContentView|onCreate\s*\("),
                          ("subtitles",r"OpenSubtitles|subtitle"),
                          ("Firebase",r"FirebaseRemoteConfig|FirebaseDatabase|FirebaseAuth")
                      ]:
                          if re.search(rx, txt, re.I): library[label] += 1
                      if any(x in nm.lower() for x in ("androidx/", "kotlin/", "kotlinx/", "com/google/", "com/android/", "org/jetbrains/", "okhttp3/", "retrofit2/", "com/squareup/", "com/bumptech/", "com/facebook/", "fasterxml/")):
                          continue
                      nmatch = len(hits.findall(txt))
                      ui = bool(re.search(r"extends AppCompatActivity|extends Activity|extends Fragment|setContentView|onCreate\s*\(", txt))
                      if nmatch >= 2 or (ui and re.search(r"R\.(string|layout|id)\.", txt)):
                          score = nmatch + (4 if ui else 0)
                          lines = []
                          for line in txt.splitlines():
                              if hits.search(line):
                                  line = re.sub(r'(?i)((?:api[_-]?key|access[_-]?token|client[_-]?secret|authorization|password|secret)\s*["\']?\s*[:=]\s*["\']?)[^"\'\s,;}]+', r'\1[REDACTED]', line)
                                  line = re.sub(r'(?i)(https?://[^/\s?]+)[^\s"\']*\?[^\s"\']*', r'\1?[query redacted]', line)
                                  lines.append(clean(line))
                              if len(lines) >= 5: break
                          candidates.append((score,nm,i.file_size,lines))
          add("## Cross-source findings")
          add(f"- JADX source/resource text files scanned in full: {total_scanned}")
          add("- Most relevant likely application files (third-party framework packages omitted):")
          candidates.sort(key=lambda v:(-v[0],v[1]))
          for score,nm,size,lines in candidates[:45]:
              add("### " + clean(nm) + f" ({size:,} bytes; relevance {score})")
              for line in lines: add("  - " + line[:250])
          add("")
          add("### Network hostnames found (query strings excluded)")
          for host,count in endpoints.most_common(50): add(f"- {clean(host)} ({count} references)")
          add("")
          add("### Code/library indicators")
          for label,count in library.most_common(): add(f"- {label}: {count} files")
          add("")
          with open("inspection-report.md","w",encoding="utf-8") as f:
              f.write("\n".join(out)+"\n")
          print("Finished focused archive analysis.")
          PY
      - name: Package relevant decompiled source for analysis
        shell: bash
        run: |
          python - <<'PY'
          import zipfile, re, os
          src = "jadx-sources.zip"
          out = "onstream-source-subset.zip"
          keep = []
          api_annotation = re.compile(r"@(GET|POST|PUT|DELETE|PATCH|HTTP|Headers|FormUrlEncoded|Multipart|Streaming)\b")
          core = "sources/com/maertsno/"
          player = "sources/com/maertsno/exoplayer/"
          with zipfile.ZipFile(src) as z, zipfile.ZipFile(out, "w", zipfile.ZIP_DEFLATED) as dst:
              for info in z.infolist():
                  p = info.filename
                  if info.is_dir():
                      continue
                  include = False
                  if p.startswith(core) and p.endswith((".java", ".kt")):
                      include = True
                  elif p.startswith(player) and p.endswith((".java", ".kt")):
                      include = True
                  elif p.startswith("sources/p175s6/") and p.endswith((".java", ".kt")):
                      include = True
                  elif p.startswith("sources/L6/") and p.endswith((".java", ".kt")):
                      include = True
                  elif p == "resources/AndroidManifest.xml":
                      include = True
                  elif p.startswith("resources/res/navigation/") and p.endswith(".xml"):
                      include = True
                  elif p.startswith("resources/res/layout/") and p.endswith(".xml") and re.search(r"(activity_main|activity_player|activity_movie_player|activity_trailer|fragment_home|fragment_main|item_movie|item_series|item_episode|bottom_navigation)", p, re.I):
                      include = True
                  elif p.startswith("resources/res/values/") and p.endswith(".xml") and re.search(r"(strings|colors|dimens|styles|themes|arrays|ids)\.xml$", p, re.I):
                      include = True
                  elif p.startswith("sources/") and p.endswith((".java", ".kt")) and info.file_size < 250000:
                      if any(x in p.lower() for x in ("androidx/", "kotlin/", "kotlinx/", "com/google/", "com/android/", "org/jetbrains/", "okhttp3/", "retrofit2/", "com/squareup/", "com/bumptech/", "com/facebook/")):
                          include = False
                      else:
                          try:
                              txt = z.read(info).decode("utf-8", "ignore")
                              include = bool(api_annotation.search(txt)) or bool(re.search(r"(?i)(retrofit|okhttp|com\.maertsno\.(data|domain)|baseurl|base_url|api[_-]?key|firebase.remoteconfig)", txt))
                          except Exception:
                              include = False
                  if include:
                      try:
                          dst.writestr("jadx/" + p, z.read(info))
                          keep.append(p)
                      except Exception:
                          pass
          print("Packaged", len(keep), "files; archive size", os.path.getsize(out), "bytes.")
          print("Representative files:")
          for p in keep[:100]:
              print(p)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: onstream-source-subset
          path: onstream-source-subset.zip
          if-no-files-found: error
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: original-jadx-sources
          path: jadx-sources.zip
          if-no-files-found: error
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: apktool-original
          path: apktool-output.zip
          if-no-files-found: error
          retention-days: 3
      - name: Publish report
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add inspection-report.md
          if git diff --cached --quiet; then
            echo "No report changes to commit."
          else
            git commit -m "Refresh focused OnStream archive inspection report"
            git push
          fi
