name: Inspect OnStream archives
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Analyze ZIPs safely (do not execute archive contents)
        shell: bash
        run: |
          python - <<'PY'
          import os, re, zipfile, collections
          out = []
          out.append("# OnStream archive inspection report")
          out.append("")
          out.append("Generated by a read-only ZIP inspection. Archive contents were not executed or extracted to filesystem paths.")
          out.append("")
          archives = ["jadx-sources.zip", "apktool-output.zip"]
          key_names = re.compile(r"(AndroidManifest|MainActivity|Application|Player|Playback|Video|Stream|Source|Api|Client|Network|Retrofit|OkHttp|ExoPlayer|Media3|WebView|Movie|Tv|Home|Detail|Repository|Hls|M3u8|Config|BuildConfig|strings\.xml|network_security_config|proguard|\.gradle$)", re.I)
          host_re = re.compile(r"https?://[A-Za-z0-9._~:/?#\[\]@!$&'()*+,;=%-]+")
          remaining = 55000
          for archive in archives:
              out.append(f"## {archive}")
              if not os.path.isfile(archive):
                  out.append("Archive not present in repository at workflow runtime.")
                  out.append("")
                  continue
              try:
                  with zipfile.ZipFile(archive) as z:
                      infos = [i for i in z.infolist() if not i.is_dir()]
                      total_size = sum(i.file_size for i in infos)
                      out.append(f"- Entries: {len(infos)} files")
                      out.append(f"- Uncompressed total: {total_size:,} bytes")
                      roots = collections.Counter((i.filename.split('/')[0] if '/' in i.filename else '(root)') for i in infos)
                      out.append("- Top-level paths: " + ", ".join(f"{k} ({v})" for k,v in roots.most_common(18)))
                      candidates = [i for i in infos if key_names.search(i.filename)]
                      candidates.sort(key=lambda i: (0 if "AndroidManifest.xml" in i.filename else 1, 0 if re.search(r"(MainActivity|Application|Player|Playback|Api|Network|Retrofit|OkHttp|ExoPlayer|Media3|WebView|Stream|Source|Repository)", i.filename, re.I) else 2, len(i.filename), i.filename))
                      out.append(f"- Key-named candidates: {len(candidates)}")
                      for i in candidates[:100]:
                          out.append(f"  - {i.filename} ({i.file_size:,} bytes)")
                      paths = []
                      for i in infos:
                          p = i.filename
                          if i.file_size <= 160000 and re.search(r"(AndroidManifest\.xml|\.java$|\.kt$|\.xml$|\.json$|\.properties$|\.gradle$|\.smali$)", p, re.I):
                              if key_names.search(p) or p.endswith("AndroidManifest.xml"):
                                  paths.append(i)
                      paths.sort(key=lambda i: (0 if "AndroidManifest.xml" in i.filename else 1, 0 if re.search(r"(MainActivity|Application|Player|Playback|Api|Network|Retrofit|OkHttp|ExoPlayer|Media3|WebView|Stream|Source|Repository)", i.filename, re.I) else 2, len(i.filename), i.filename))
                      seen_urls = set()
                      scanned = 0
                      for i in infos:
                          if i.file_size > 500000 or not re.search(r"\.(java|kt|xml|json|properties|gradle|smali|txt)$", i.filename, re.I):
                              continue
                          try:
                              txt = z.read(i).decode("utf-8", "ignore")
                          except Exception:
                              continue
                          scanned += 1
                          for u in host_re.findall(txt):
                              u = u.rstrip('.,;:)"\']')
                              if len(u) < 200:
                                  seen_urls.add(u)
                          if scanned >= 2200:
                              break
                      out.append(f"- Text files scanned for endpoint strings: {scanned}")
                      if seen_urls:
                          out.append("- URL strings (may include examples/placeholders):")
                          for u in sorted(seen_urls)[:100]:
                              out.append("  - " + u)
                      out.append("")
                      for i in paths[:35]:
                          if remaining <= 0:
                              break
                          try:
                              txt = z.read(i).decode("utf-8", "ignore")
                          except Exception:
                              continue
                          if not txt.strip():
                              continue
                          excerpt = txt[:min(2600, remaining)]
                          out.append(f"### {i.filename}")
                          out.append("~~~")
                          out.append(excerpt.replace("~~~", "[fence]"))
                          if len(txt) > len(excerpt):
                              out.append("[excerpt truncated]")
                          out.append("~~~")
                          out.append("")
                          remaining -= len(excerpt)
              except Exception as e:
                  out.append("Could not inspect archive: " + repr(e))
              out.append("")
          with open("inspection-report.md", "w", encoding="utf-8") as f:
              f.write("\n".join(out) + "\n")
          print("Inspection report generated; archive code was not executed.")
          PY
      - name: Publish report
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add inspection-report.md
          if git diff --cached --quiet; then
            echo "No report changes to commit."
          else
            git commit -m "Add OnStream archive inspection report"
            git push
          fi
